<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandarin HSK 1 Learning Quiz</title>
<style>
	/* ---------- Design tokens ---------- */
	:root {
		--color-bg: #f5f5f5;
		--color-surface: #ffffff;
		--color-surface-alt: #f8f9fa;
		--color-text: #333333;
		--color-text-heading: #2c3e50;
		--color-text-muted: #7f8c8d;
		--color-border: #bdc3c7;
		--color-divider: #ecf0f1;

		--color-primary: #3498db;
		--color-primary-dark: #2980b9;
		--color-neutral: #95a5a6;
		--color-neutral-dark: #7f8c8d;
		--color-audio: #9b59b6;
		--color-audio-dark: #8e44ad;

		--color-success: #2ecc71;
		--color-success-dark: #27ae60;
		--color-success-bg: #d5f4e6;
		--color-error: #e74c3c;
		--color-error-dark: #c0392b;
		--color-error-bg: #fadbd8;

		--radius-sm: 4px;
		--radius-md: 6px;
		--radius-lg: 8px;

		--space-xs: 8px;
		--space-sm: 12px;
		--space-md: 15px;
		--space-lg: 20px;

		--transition-fast: 0.2s ease;
		--transition-normal: 0.3s ease;
	}

	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	body {
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
		background-color: var(--color-bg);
		color: var(--color-text);
		padding: 10px;
		min-height: 100vh;
	}

	.container {
		max-width: 600px;
		margin: 0 auto;
		background-color: var(--color-surface);
		border-radius: var(--radius-lg);
		box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
		padding: var(--space-lg);
		min-height: 100vh;
		display: flex;
		flex-direction: column;
	}

	h1 {
		font-size: 24px;
		margin-bottom: var(--space-xs);
		text-align: center;
		color: var(--color-text-heading);
	}

	.subtitle {
		text-align: center;
		color: var(--color-text-muted);
		margin-bottom: var(--space-lg);
		font-size: 14px;
	}

	/* ---------- Buttons: one consistent system ----------
		btn-action	= primary interactive action (start a quiz, play audio, submit)
		btn-neutral	= secondary/navigational action (back, view list)
		btn-audio	= the pill-shaped audio trigger
		Semantic color (success/error) is reserved ONLY for answer feedback,
		never for menu navigation, so color always means the same thing. */
	.btn {
		display: block;
		padding: 15px 20px;
		font-size: 16px;
		border: none;
		border-radius: var(--radius-md);
		cursor: pointer;
		transition: background-color var(--transition-normal), transform var(--transition-normal);
		text-align: center;
		width: 100%;
	}

	.btn-action {
		background-color: var(--color-primary);
		color: white;
	}

	.btn-action:active {
		background-color: var(--color-primary-dark);
		transform: scale(0.98);
	}

	.btn-neutral {
		background-color: var(--color-neutral);
		color: white;
	}

	.btn-neutral:active {
		background-color: var(--color-neutral-dark);
		transform: scale(0.98);
	}

	.btn-back {
		margin-top: var(--space-md);
	}

	.menu-section {
		flex: 1;
		display: flex;
		flex-direction: column;
		justify-content: center;
		gap: var(--space-md);
	}

	.quiz-screen {
		display: none;
	}

	.quiz-screen.active {
		display: flex;
		flex-direction: column;
	}

	.progress-bar {
		width: 100%;
		height: 6px;
		background-color: var(--color-divider);
		border-radius: 3px;
		margin-bottom: var(--space-md);
		overflow: hidden;
	}

	.progress-fill {
		height: 100%;
		background-color: var(--color-primary);
		transition: width var(--transition-normal);
	}

	.question-area {
		flex: 1;
		display: flex;
		flex-direction: column;
		justify-content: center;
		gap: var(--space-md);
		margin-bottom: var(--space-md);
		text-align: center;
	}

	.question-title {
		font-size: 18px;
		color: var(--color-text-muted);
	}

	.question-content {
		font-size: 28px;
		color: var(--color-text-heading);
		font-weight: bold;
		margin: var(--space-md) 0;
		line-height: 1.6;
	}

	.pinyin-text {
		font-size: 18px;
		color: var(--color-primary);
		margin: 10px 0;
	}

	.english-text {
		font-size: 16px;
		color: var(--color-text-muted);
		font-style: italic;
		margin: 8px 0;
	}

	.audio-button-area {
		display: flex;
		gap: 10px;
		justify-content: center;
		margin: 10px 0;
	}

	.btn-audio {
		padding: 10px 20px;
		font-size: 14px;
		background-color: var(--color-audio);
		color: white;
		border: none;
		border-radius: var(--radius-md);
		cursor: pointer;
		transition: background-color var(--transition-normal), transform var(--transition-normal);
	}

	.btn-audio:active {
		background-color: var(--color-audio-dark);
		transform: scale(0.98);
	}

	.options-area {
		display: grid;
		grid-template-columns: 1fr;
		gap: 10px;
		margin-top: var(--space-md);
	}

	.option {
		padding: 12px 15px;
		font-size: 15px;
		border: 2px solid var(--color-border);
		background-color: var(--color-surface);
		border-radius: var(--radius-md);
		cursor: pointer;
		text-align: left;
		transition: all var(--transition-fast);
		font-family: inherit;
	}

	.option:disabled {
		cursor: default;
	}

	.option.correct {
		border-color: var(--color-success);
		background-color: var(--color-success-bg);
	}

	.option.incorrect {
		border-color: var(--color-error);
		background-color: var(--color-error-bg);
	}

	.feedback {
		margin-top: var(--space-md);
		padding: var(--space-sm);
		border-radius: var(--radius-md);
		text-align: center;
		font-size: 15px;
		font-weight: 600;
	}

	.feedback.success {
		background-color: var(--color-success-bg);
		color: var(--color-success-dark);
	}

	.feedback.error {
		background-color: var(--color-error-bg);
		color: var(--color-error-dark);
	}

	.results-screen {
		text-align: center;
	}

	.results-screen h2 {
		font-size: 20px;
		margin: var(--space-md) 0;
		color: var(--color-text-heading);
	}

	.results-score {
		font-size: 32px;
		font-weight: bold;
		color: var(--color-primary);
		margin: var(--space-lg) 0;
	}

	.results-detail {
		font-size: 16px;
		color: var(--color-text-muted);
		margin: 10px 0;
		line-height: 1.6;
	}

	.sentence-display {
		background-color: var(--color-surface-alt);
		padding: var(--space-md);
		border-radius: var(--radius-md);
		margin: 10px 0;
	}

	.vocabulary-list {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: var(--space-sm);
		margin-top: var(--space-md);
	}

	.vocab-item {
		padding: var(--space-sm);
		background-color: var(--color-surface-alt);
		border: none;
		border-radius: var(--radius-md);
		text-align: center;
		font-size: 14px;
		cursor: pointer;
		transition: background-color var(--transition-fast), transform var(--transition-fast);
		font-family: inherit;
		width: 100%;
	}

	.vocab-item:active {
		background-color: #e8eef5;
		transform: scale(0.98);
	}

	.vocab-chinese {
		font-size: 18px;
		font-weight: bold;
		color: var(--color-text-heading);
		margin-bottom: 4px;
	}

	.vocab-pinyin {
		font-size: 12px;
		color: var(--color-primary);
		margin-bottom: 4px;
	}

	.vocab-english {
		font-size: 12px;
		color: var(--color-text-muted);
	}

	@media (max-width: 480px) {
		.container {
			padding: var(--space-md);
		}

		h1 {
			font-size: 20px;
		}

		.question-content {
			font-size: 24px;
		}

		.btn {
			padding: 12px 15px;
			font-size: 15px;
		}

		.results-score {
			font-size: 28px;
		}

		.vocabulary-list {
			grid-template-columns: 1fr;
		}
	}
</style>
</head>
<body>
	<div class="container">
		<!-- Main Menu -->
		<div id="mainMenu" class="active">
			<h1>HSK 1 Mandarin</h1>
			<div class="subtitle">Learning Quiz</div>
			<div class="menu-section">
				<button class="btn btn-action" data-action="start-character-quiz">
					Character Quiz — Hear &amp; Identify
				</button>
				<button class="btn btn-action" data-action="start-reverse-quiz">
					Pinyin Quiz — Read &amp; Identify
				</button>
				<button class="btn btn-action" data-action="start-sentence-quiz">
					Sentence Quiz — Hear &amp; Match
				</button>
				<button class="btn btn-action" data-action="start-sentence-builder">
					Sentence Practice — Read &amp; Listen
				</button>
				<button class="btn btn-neutral" data-action="show-vocabulary">
					View Vocabulary List
				</button>
			</div>
		</div>

		<!-- Character Quiz Screen -->
		<div id="characterQuizScreen" class="quiz-screen">
			<div class="progress-bar"><div class="progress-fill" id="charProgress"></div></div>
			<div class="question-title">Listen and select the character</div>
			<div class="question-area">
				<div class="audio-button-area">
					<button class="btn-audio" data-action="replay-audio">Play Audio</button>
				</div>
				<div id="charFeedback" aria-live="polite"></div>
			</div>
			<div class="options-area" id="charOptions"></div>
			<button class="btn btn-neutral btn-back" data-action="return-to-menu">Back to Menu</button>
		</div>

		<!-- Reverse Quiz Screen -->
		<div id="reverseQuizScreen" class="quiz-screen">
			<div class="progress-bar"><div class="progress-fill" id="reverseProgress"></div></div>
			<div class="question-title">Read and select the meaning</div>
			<div class="question-area">
				<div class="question-content" id="reverseDisplay"></div>
				<div class="audio-button-area">
					<button class="btn-audio" data-action="replay-audio">Play Audio</button>
				</div>
				<div id="reverseFeedback" aria-live="polite"></div>
			</div>
			<div class="options-area" id="reverseOptions"></div>
			<button class="btn btn-neutral btn-back" data-action="return-to-menu">Back to Menu</button>
		</div>

		<!-- Sentence Quiz Screen -->
		<div id="sentenceQuizScreen" class="quiz-screen">
			<div class="progress-bar"><div class="progress-fill" id="sentenceProgress"></div></div>
			<div class="question-title">Listen and select the sentence</div>
			<div class="question-area">
				<div class="audio-button-area">
					<button class="btn-audio" data-action="replay-audio">Play Audio</button>
				</div>
				<div id="sentenceFeedback" aria-live="polite"></div>
			</div>
			<div class="options-area" id="sentenceOptions"></div>
			<button class="btn btn-neutral btn-back" data-action="return-to-menu">Back to Menu</button>
		</div>

		<!-- Sentence Builder (Practice) Screen -->
		<div id="sentenceBuilderScreen" class="quiz-screen">
			<div class="progress-bar"><div class="progress-fill" id="sentenceBuilderProgress"></div></div>
			<div class="question-title">Read and listen to sentences</div>
			<div class="question-area">
				<div class="sentence-display">
					<div class="question-content" id="sentenceDisplay"></div>
					<div class="pinyin-text" id="pinyinDisplay"></div>
					<div class="english-text" id="englishDisplay"></div>
				</div>
				<div class="audio-button-area">
					<button class="btn-audio" data-action="replay-audio">Play Audio</button>
				</div>
			</div>
			<button class="btn btn-action" data-action="next-sentence">Next Sentence</button>
			<button class="btn btn-neutral btn-back" data-action="return-to-menu">Back to Menu</button>
		</div>

		<!-- Vocabulary Screen -->
		<div id="vocabularyScreen" class="quiz-screen">
			<h2 style="margin-bottom: 15px;">HSK 1 Vocabulary</h2>
			<div class="vocabulary-list" id="vocabList"></div>
			<button class="btn btn-neutral btn-back" data-action="return-to-menu">Back to Menu</button>
		</div>

		<!-- Practice Complete Screen (Sentence Builder has no score, so it gets its own screen) -->
		<div id="practiceCompleteScreen" class="quiz-screen results-screen">
			<h2>Practice Complete!</h2>
			<div class="results-detail">You reviewed every sentence in this set. Nice work!</div>
			<button class="btn btn-action" data-action="return-to-menu" style="margin-top: 20px;">Return to Menu</button>
		</div>

		<!-- Results Screen (quizzes with a score) -->
		<div id="resultsScreen" class="quiz-screen results-screen">
			<h2>Quiz Complete!</h2>
			<div class="results-score" id="scoreDisplay"></div>
			<div class="results-detail" id="resultsDetail"></div>
			<button class="btn btn-action" data-action="return-to-menu" style="margin-top: 20px;">Return to Menu</button>
		</div>
	</div>

	<script>
	'use strict';

	// ---------- Data ----------
	const vocabulary = [
		{ chinese: '好', pinyin: 'hǎo', english: 'Good / Well / Fine', pinyinFile: '2/22/Zh-h%C7%8Eo' },
		{ chinese: '很', pinyin: 'hěn', english: 'Very / Quite', pinyinFile: 'd/df/Zh-h%C4%9Bn' },
		{ chinese: '吗', pinyin: 'ma', english: '(Question particle)', pinyinFile: '3/37/Zh-ma' },
		{ chinese: '你', pinyin: 'nǐ', english: 'You (Singular)', pinyinFile: '7/73/Zh-n%C7%90' },
		{ chinese: '我', pinyin: 'wǒ', english: 'I / Me / My', pinyinFile: '4/42/Zh-w%C7%92' }
	];

	const sentences = [
		{ chinese: '很好！', pinyin: 'hěn hǎo!', english: 'Very good! / Great!' },
		{ chinese: '你好！', pinyin: 'nǐ hǎo!', english: 'Hello!' },
		{ chinese: '你好吗？', pinyin: 'nǐ hǎo ma?', english: 'How are you?' },
		{ chinese: '你很好！', pinyin: 'nǐ hěn hǎo!', english: 'You are good! / You are a good person!' },
		{ chinese: '我很好！', pinyin: 'wǒ hěn hǎo!', english: 'I am good! / I am doing well!' }
	];

	const OPTIONS_PER_QUESTION = 4;
	const FEEDBACK_DELAY_MS = 1500;
	const AUDIO_BASE_URL = 'https://upload.wikimedia.org/wikipedia/commons/';

	// ---------- Quiz state ----------
	// A single state object instead of scattered globals keeps the "what mode
	// am I in / how far am I / how did I do" logic in one predictable place.
	const state = {
		quizType: null, // 'character' | 'reverse' | 'sentence' | 'builder'
		questions: [],
		index: 0,
		score: 0,
		hasScore: true, // false for the sentence-builder practice mode
		audioQueue: []
	};

	// ---------- Generic helpers ----------
	function shuffle(array) {
		const arr = [...array];
		for (let i = arr.length - 1; i > 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
			[arr[i], arr[j]] = [arr[j], arr[i]];
		}
		return arr;
	}

	// Pick `count` random wrong answers plus the correct one, then shuffle.
	function buildOptions(correctItem, pool, matchKey) {
		const distractors = shuffle(pool.filter(item => item[matchKey] !== correctItem[matchKey]))
			.slice(0, OPTIONS_PER_QUESTION - 1);
		return shuffle([correctItem, ...distractors]);
	}

	function showScreen(screenId) {
		document.querySelectorAll('.quiz-screen, #mainMenu').forEach(el => el.classList.remove('active'));
		document.getElementById(screenId).classList.add('active');
	}

	function updateProgress(current, total, progressId) {
		document.getElementById(progressId).style.width = `${(current / total) * 100}%`;
	}

	function clearChildren(el) {
		el.replaceChildren();
	}

	// ---------- Audio ----------
	function getAudioPath(pinyinFile) {
		return `${AUDIO_BASE_URL}${pinyinFile}.ogg`;
	}

	function playSingle(path) {
		const audio = new Audio(path);
		audio.play().catch(() => console.warn(`Audio not available: ${path}`));
	}

	// Plays a list of audio clips back-to-back, one at a time.
	function playSequence(paths) {
		state.audioQueue = [...paths];
		playNextInQueue();
	}

	function playNextInQueue() {
		if (state.audioQueue.length === 0) return;
		const path = state.audioQueue.shift();
		const audio = new Audio(path);
		audio.onended = playNextInQueue;
		audio.onerror = playNextInQueue;
		audio.play().catch(playNextInQueue);
	}

	// Sentences aren't individually recorded, so we stitch together audio for
	// each character we recognize from the vocabulary list.
	function getSentenceAudioPaths(chineseText) {
		const punctuation = new Set(['。', '，', '？', '！']);
		return [...chineseText]
			.filter(char => !punctuation.has(char))
			.map(char => vocabulary.find(v => v.chinese.includes(char)))
			.filter(Boolean)
			.map(v => getAudioPath(v.pinyinFile));
	}

	function playSentenceAudio(chineseText) {
		playSequence(getSentenceAudioPaths(chineseText));
	}

	// Replays audio for whatever question is currently on screen.
	function replayCurrentAudio() {
		const question = state.questions[state.index];
		if (!question) return;
		if (state.quizType === 'sentence' || state.quizType === 'builder') {
			playSentenceAudio(question.chinese);
		} else {
			playSingle(getAudioPath(question.pinyinFile));
		}
	}

	// ---------- Quiz flow (shared by character / reverse / sentence quizzes) ----------
	const QUIZ_CONFIG = {
		character: {
			screenId: 'characterQuizScreen',
			progressId: 'charProgress',
			optionsId: 'charOptions',
			feedbackId: 'charFeedback',
			pool: vocabulary,
			matchKey: 'chinese',
			renderOptionLabel: item => item.chinese,
			onEnter: question => playSingle(getAudioPath(question.pinyinFile))
		},
		reverse: {
			screenId: 'reverseQuizScreen',
			progressId: 'reverseProgress',
			optionsId: 'reverseOptions',
			feedbackId: 'reverseFeedback',
			pool: vocabulary,
			matchKey: 'chinese',
			renderOptionLabel: item => `${item.pinyin} — ${item.english}`,
			onEnter: question => {
				document.getElementById('reverseDisplay').textContent = question.chinese;
				playSingle(getAudioPath(question.pinyinFile));
			}
		},
		sentence: {
			screenId: 'sentenceQuizScreen',
			progressId: 'sentenceProgress',
			optionsId: 'sentenceOptions',
			feedbackId: 'sentenceFeedback',
			pool: sentences,
			matchKey: 'chinese',
			renderOptionLabel: item => item.chinese,
			onEnter: question => playSentenceAudio(question.chinese)
		}
	};

	function startQuiz(quizType, sourceData) {
		state.quizType = quizType;
		state.questions = shuffle(sourceData);
		state.index = 0;
		state.score = 0;
		state.hasScore = true;
		showQuestion();
		showScreen(QUIZ_CONFIG[quizType].screenId);
	}

	function showQuestion() {
		const config = QUIZ_CONFIG[state.quizType];
		if (state.index >= state.questions.length) {
			showResults();
			return;
		}

		const question = state.questions[state.index];
		const options = buildOptions(question, config.pool, config.matchKey);

		updateProgress(state.index + 1, state.questions.length, config.progressId);

		const optionsContainer = document.getElementById(config.optionsId);
		clearChildren(optionsContainer);
		options.forEach(option => {
			const button = document.createElement('button');
			button.className = 'option';
			button.textContent = config.renderOptionLabel(option);
			button.addEventListener('click', () => selectAnswer(option, question, config, button));
			optionsContainer.appendChild(button);
		});

		document.getElementById(config.feedbackId).replaceChildren();
		config.onEnter(question);
	}

	function selectAnswer(chosenOption, correctQuestion, config, button) {
		const isCorrect = chosenOption[config.matchKey] === correctQuestion[config.matchKey];
		const feedback = document.getElementById(config.feedbackId);
		const optionButtons = document.getElementById(config.optionsId).querySelectorAll('.option');

		// Prevent double answers while feedback is showing.
		optionButtons.forEach(btn => btn.disabled = true);

		const feedbackEl = document.createElement('div');
		feedbackEl.className = `feedback ${isCorrect ? 'success' : 'error'}`;
		feedbackEl.textContent = isCorrect ? 'Correct!' : 'Incorrect';
		feedback.replaceChildren(feedbackEl);
		button.classList.add(isCorrect ? 'correct' : 'incorrect');

		if (isCorrect) state.score++;
		setTimeout(() => {
			state.index++;
			showQuestion();
		}, FEEDBACK_DELAY_MS);
	}

	// ---------- Sentence Builder (self-paced practice, no scoring) ----------
	function startSentenceBuilder() {
		state.quizType = 'builder';
		state.questions = shuffle(sentences);
		state.index = 0;
		state.hasScore = false;
		showSentenceBuilderCard();
		showScreen('sentenceBuilderScreen');
	}

	function showSentenceBuilderCard() {
		if (state.index >= state.questions.length) {
			showScreen('practiceCompleteScreen');
			return;
		}

		const sentence = state.questions[state.index];
		updateProgress(state.index + 1, state.questions.length, 'sentenceBuilderProgress');

		document.getElementById('sentenceDisplay').textContent = sentence.chinese;
		document.getElementById('pinyinDisplay').textContent = sentence.pinyin;
		document.getElementById('englishDisplay').textContent = sentence.english;

		playSentenceAudio(sentence.chinese);
	}

	function advanceSentenceBuilder() {
		state.index++;
		showSentenceBuilderCard();
	}

	// ---------- Vocabulary list ----------
	function showVocabulary() {
		const list = document.getElementById('vocabList');
		clearChildren(list);

		vocabulary.forEach(v => {
			const item = document.createElement('button');
			item.className = 'vocab-item';
			item.innerHTML = `
				<div class="vocab-chinese">${v.chinese}</div>
				<div class="vocab-pinyin">${v.pinyin}</div>
				<div class="vocab-english">${v.english}</div>
			`;
			item.addEventListener('click', () => playSingle(getAudioPath(v.pinyinFile)));
			list.appendChild(item);
		});

		showScreen('vocabularyScreen');
	}

	// ---------- Results ----------
	function showResults() {
		const percentage = Math.round((state.score / state.questions.length) * 100);
		document.getElementById('scoreDisplay').textContent = `${state.score} / ${state.questions.length}`;
		document.getElementById('resultsDetail').textContent = `Score: ${percentage}%`;
		showScreen('resultsScreen');
	}

	function returnToMenu() {
		state.quizType = null;
		state.questions = [];
		state.index = 0;
		state.score = 0;
		showScreen('mainMenu');
	}

	// ---------- Action routing ----------
	// One delegated listener maps data-action attributes to handlers, instead
	// of inline onclick="" attributes scattered through the markup.
	const ACTIONS = {
		'start-character-quiz': () => startQuiz('character', vocabulary),
		'start-reverse-quiz': () => startQuiz('reverse', vocabulary),
		'start-sentence-quiz': () => startQuiz('sentence', sentences),
		'start-sentence-builder': startSentenceBuilder,
		'show-vocabulary': showVocabulary,
		'return-to-menu': returnToMenu,
		'replay-audio': replayCurrentAudio,
		'next-sentence': advanceSentenceBuilder
	};

	document.addEventListener('click', event => {
		const trigger = event.target.closest('[data-action]');
		if (!trigger) return;
		const handler = ACTIONS[trigger.dataset.action];
		if (handler) handler();
	});

	window.addEventListener('load', () => showScreen('mainMenu'));
	</script>
</body>
</html>
